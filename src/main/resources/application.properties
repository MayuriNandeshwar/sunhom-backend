spring.application.name=sunhom-backend

# ===============================
# DATABASE (LOCAL POSTGRESQL)
# ===============================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/sunhom_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Supabase (Switch later via env vars or uncommenting) ---
# spring.datasource.url=jdbc:postgresql://db.dxndpffpacqgqulgzhyh.supabase.co:5432/postgres
# spring.datasource.username=postgres
# spring.datasource.password=<SUPABASE_DB_PASSWORD>

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===============================
# FLYWAY
# ===============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
#spring.flyway.url=${DATABASE_URL}
#spring.flyway.user=${SPRING_DATASOURCE_USERNAME}
#spring.flyway.password=${SPRING_DATASOURCE_PASSWORD}

spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${spring.datasource.username}
spring.flyway.password=${spring.datasource.password}

# ===============================
# CACHE CONFIG (LOCAL REDIS)
# ===============================
spring.cache.type=${CACHE_TYPE:none}
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
# spring.data.redis.url=${SPRING_DATA_REDIS_URL}

# ===============================
# SERVER
# ===============================
server.port=${PORT:8080}
server.address=0.0.0.0

# ===============================
# JWT
# ===============================
#security.jwt.secret=${JWT_SECRET}
#security.jwt.issuer=${JWT_ISSUER}
security.jwt.secret=local-dev-secret-change-me-at-least-32-chars
security.jwt.issuer=sunhom
security.jwt.access-token-expiry=1800
# ===============================
# CLOUDINARY
# ===============================
#cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
#cloudinary.api-key=${CLOUDINARY_API_KEY}
#cloudinary.api-secret=${CLOUDINARY_API_SECRET}

cloudinary.cloud-name=dummy
cloudinary.api-key=dummy
cloudinary.api-secret=dummy
# ===============================
# MAIL (SMTP) CONFIGURATION
# ===============================
spring.mail.host=${SPRING_MAIL_HOST:smtp.hostinger.com}
spring.mail.port=${SPRING_MAIL_PORT:465}
spring.mail.username=${SPRING_MAIL_USERNAME:info@sunhom.in}
spring.mail.password=${SPRING_MAIL_PASSWORD:Sunhom$071182}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=*
sunhom.mail.from=${MAIL_FROM:info@sunhom.in}
